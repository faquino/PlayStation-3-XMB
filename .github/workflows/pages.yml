# Publishes ps3xmbwave/ as the root of this repository's GitHub Pages site,
# which upstream does with `npm run deploy` and a gh-pages branch.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".
name: Deploy ps3xmbwave to Pages

on:
  # Pushes to the default branch that change the site, or this workflow
  push:
    branches: [main]
    paths:
      - 'ps3xmbwave/**'
      - '.github/workflows/pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'ps3xmbwave'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
